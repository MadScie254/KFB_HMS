name: Quality checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      KFB_ENV: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check hospital kfb_hms
      - run: python manage.py test
      # A model change without its migration passes every test and then breaks
      # the next deployment, so the two are pinned together here.
      - run: python manage.py makemigrations --check --dry-run
      # Checked against a production configuration, not the demo one. Run in
      # demo mode this validates settings no hospital will ever use, so it
      # could not fail on a production misconfiguration.
      - run: >-
          KFB_ENV=production
          KFB_SECRET_KEY=ci-only-not-a-real-secret-0123456789abcdefghijklmnopqrstuvwxyz
          KFB_DATABASE_URL=postgresql://ci:ci@127.0.0.1:5432/ci
          KFB_ALLOWED_HOSTS=hospital.example.test
          python manage.py check --deploy --fail-level WARNING

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KFB_ENV: production
      KFB_SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdefghijklmnopqrstuvwxyz
      KFB_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      KFB_ALLOWED_HOSTS: hospital.example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python manage.py migrate --noinput
      - run: >-
          python manage.py test
          hospital.tests.InvoiceBalanceRaceTests
          hospital.tests.PostgreSQLAuditTriggerTests
          hospital.tests.WorkflowTests.test_shift_opening_is_unique_and_review_is_independent
          hospital.tests.WorkflowTests.test_supplier_change_requires_independent_review_and_current_snapshot
          hospital.tests.WorkflowTests.test_service_without_approved_price_cannot_be_released_unbilled
