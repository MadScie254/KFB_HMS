name: Quality checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      KFB_ENV: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check hospital kfb_hms
      - run: python manage.py test
      - run: KFB_SECRET_KEY=ci-only-key KFB_ALLOWED_HOSTS=localhost python manage.py check --deploy
