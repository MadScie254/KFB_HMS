{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Pages">{% if page.has_previous %}<a class="button ghost small" href="?page={{ page.previous_page_number }}{{ filter_query }}">Previous</a>{% endif %}<span>Page {{ page.number }} of {{ page.paginator.num_pages }}{% if sort_is_page_only %} · Column sorting applies to this page only.{% endif %}</span>{% if page.has_next %}<a class="button ghost small" href="?page={{ page.next_page_number }}{{ filter_query }}">Next</a>{% endif %}</nav>{% endif %}
