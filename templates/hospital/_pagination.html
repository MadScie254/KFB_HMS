{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Pages">{% if page.has_previous %}<a class="button ghost small" href="?page={{ page.previous_page_number }}{% if query %}&amp;q={{ query|urlencode }}{% endif %}{% if action_filter %}&amp;action={{ action_filter|urlencode }}{% endif %}{% if role_filter %}&amp;role={{ role_filter|urlencode }}{% endif %}">Previous</a>{% endif %}<span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="button ghost small" href="?page={{ page.next_page_number }}{% if query %}&amp;q={{ query|urlencode }}{% endif %}{% if action_filter %}&amp;action={{ action_filter|urlencode }}{% endif %}{% if role_filter %}&amp;role={{ role_filter|urlencode }}{% endif %}">Next</a>{% endif %}</nav>{% endif %}
