{% if form.non_field_errors %}<div class="message error">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
  {% if field.is_hidden %}{{ field }}{% else %}
  <div class="form-field {% if field.errors %}has-error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span aria-hidden="true"> *</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<small class="help-text">{{ field.help_text }}</small>{% endif %}
    {% for error in field.errors %}<small class="field-error">{{ error }}</small>{% endfor %}
  </div>
  {% endif %}
{% endfor %}
